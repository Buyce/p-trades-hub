[project]
name = "ptrades-reference"
version = "0.1.0"
description = "Offline reference and replay engine for the P-Trades deterministic scanner. Read-only; never places trades."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
